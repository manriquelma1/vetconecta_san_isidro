<main class="contenedor main-content">
<section class="grid-8-4" style="grid-template-columns:1fr 2fr;">
<!-- Tarjeta de perfil -->
<div class="card" style="text-align:center; display:flex; flex-direction:column; align-items:center;">
<div class="avatar" style="width:120px; height:120px; border:4px solid var(--color-surface-alt); margin-bottom:12px;">
<img src="fotos/julian.svg" alt="Julián Campos">
</div>
<h1 style="margin:0 0 4px; font-size:1.3rem;">{{ usuario()?.nombre }}</h1>
<p class="texto-secundario" style="margin:0 0 4px; font-size:.85rem;">{{ usuario()?.correo }}</p>
<p class="texto-secundario" style="margin:0;">Dueño de mascotas</p>
</div>
<!-- Opciones de cuenta -->
<div style="display:flex; flex-direction:column; gap:16px;">
<div class="card">
<!-- Mascota destacada -->
<div class="menu-item">
<div class="izq">
<span class="icono" style="color:var(--color-primary);"> 🐾 </span>
<h2 style="margin:0; font-size:1rem;">Mis mascotas</h2>
</div>
<a href="#" style="color:var(--color-primary); font-size:0.85rem; font-weight:600;">+ Añadir</a>
</div>
<div style="background-color:var(--color-surface-alt); border-radius:var(--radius-btn); padding:12px; display:flex; align-items:center; gap:12px; margin-bottom:8px;">
<div class="icono-circulo" style="width:56px; height:56px; background-color:var(--color-primary-light);">
<span class="icono" style="font-size:28px; color:var(--color-primary);"> 🐾 </span>
</div>
<div style="flex:1;">
<div style="display:flex; justify-content:space-between; align-items:center;">
<strong>Colita</strong>
<span class="badge badge-ok">Mestiza</span>
</div>
<div style="display:flex; gap:12px; margin-top:4px; font-size:0.75rem;" class="texto-secundario">
<span>3 años</span>
<span>12 kg</span>
</div>
</div>
<span class="icono texto-secundario">>
</span>
</div>
<!-- Enlaces de cuenta -->
<div class="menu-item">
<div class="izq">
<div class="icono-menu">
<span class="icono"> 💳 </span>
</div>
<span style="font-weight:600;">Métodos de pago</span>
</div>
<span class="icono texto-secundario">>
</span>
</div>
<div class="menu-item">
<div class="izq">
<div class="icono-menu">
<span class="icono"> 🔔 </span>
</div>
<span style="font-weight:600;">Notificaciones</span>
</div>
<span class="icono texto-secundario">>
</span>
</div>
<div class="menu-item">
<div class="izq">
<div class="icono-menu">
<span class="icono"> 🔒 </span>
</div>
<span style="font-weight:600;">Seguridad</span>
</div>
<span class="icono texto-secundario">>
</span>
</div>
</div>
<button class="btn btn-peligro" style="align-self:flex-start;" (click)="cerrarSesion()">
<span class="icono"> 🚪 </span>Cerrar sesión</button>
</div>
</section>
</main>
